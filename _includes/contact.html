<section id="contact" class="text-center container">

  <form id="form" action="https://api.web3forms.com/submit" method="POST">
    <!-- Get a free access key at https://web3forms.com (enter your email). -->
    <input type="hidden" name="access_key" value="d2052b64-feed-4b76-af5b-56f8c2093966" />
    <input type="hidden" name="subject" value="New message from maxxturing.com" />
    <input type="hidden" name="from_name" value="maxxturing.com contact form" />
    <!-- Honeypot field for spam bots; real users never see or fill this. -->
    <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none" />

    <div class="form-input">
      <label class="sr-only" for="name">Name</label>
      <input class="contact-box" id="name" name="name" required placeholder="Name" />
    </div>

    <div class="form-input">
      <label class="sr-only" for="email">Email</label>
      <input class="contact-box" id="email" name="email" type="email" required placeholder="Email" />
    </div>

    <div class="form-text">
      <label class="sr-only" for="message">Message</label>
      <textarea class="contact-box-large" rows="7" id="message" name="message" required placeholder="Message"></textarea>
    </div>

    <div>
      <button id="send" type="submit" class="bg-orange">
        Send <i class="fas fa-paper-plane fa-fw fa-1x"></i>
      </button>
    </div>
  </form>

  <div style="display:none" id="thankyou_message">
    <i style="color:#3cba54" class="fa fa-check fa-fw fa-3x"></i>
    <br /><br />
    <p>Your message has been received and you will receive a reply soon 👍</p>
  </div>

</section>

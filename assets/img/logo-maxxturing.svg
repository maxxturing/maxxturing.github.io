<?xml version="1.0" encoding="UTF-8"?>
<!-- The maxx.turing wordmark. Lifted out of an inert <template> in index.html
     that nothing ever rendered; kept because it is the only vector copy of the
     mark in the repo — every favicon and app icon is a rasterised PNG/ICO.
     Not referenced by any page on purpose: it is artwork to regenerate icons
     from, not something the site loads. Note the wordmark is live <text> in
     the system monospace face rather than outlined paths, so it will render
     slightly differently across machines; outline it before using it anywhere
     the exact letterforms matter. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="maxx.turing">
  <rect width="100" height="100" fill="#120E0A"/>
  <text x="50" y="46" font-family="monospace" font-size="13" fill="#FF8A33" text-anchor="middle" font-weight="700">maxx</text>
  <text x="50" y="62" font-family="monospace" font-size="13" fill="#FBEFE4" text-anchor="middle">.turing</text>
</svg>
